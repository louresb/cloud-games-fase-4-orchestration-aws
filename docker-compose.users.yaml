name: cloud-games
services:
  users-svc:
    build:
      context: ../cloud-games-fase-4-users
      dockerfile: Dockerfile
    container_name: users_svc_dev
    ports:
      - "5000:8080" # Mapeia porta 5000 do host para 8080 do container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${SQL_DB_USER};User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;

      # -- RabbitMQ ---
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=${RABBIT_USER}
      - RabbitMq__Password=${RABBIT_PASS}

      # -- Queues ---
      - Queues__Users__Commands=${QUEUE_USERS_CMD}
      - Queues__Users__Events=${QUEUE_USERS_EVT}
      - Queues__Catalog__Commands=${QUEUE_CATALOG_CMD}
      - Queues__Catalog__Events=${QUEUE_CATALOG_EVT}
      - Queues__Payments__Commands=${QUEUE_PAYMENTS_CMD}
      - Queues__Payments__Events=${QUEUE_PAYMENTS_EVT}
      - Queues__Notifications__Commands=${QUEUE_NOTIFICATIONS_CMD}
      - Queues__Notifications__Events=${QUEUE_NOTIFICATIONS_EVT}

      # --- Loki ---
      - Loki__Url=http://loki:3100

      # --- JWT ---
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES}

      # --- Admin User ---
      - AdminUser__Name=${ADMIN_USER_NAME}
      - AdminUser__Email=${ADMIN_USER_EMAIL}
      - AdminUser__Password=${ADMIN_USER_PASSWORD}
      - AdminUser__Role=${ADMIN_USER_ROLE}
      - AdminUser__Status=${ADMIN_USER_STATUS}
      - AdminUser__EmailConfirmed=${ADMIN_USER_EMAIL_CONFIRMED}
    restart: on-failure
    networks:
      - games-net

networks:
  games-net:
    external: true
    name: cloud-games-network