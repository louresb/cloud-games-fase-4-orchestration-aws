# Local DynamoDB used in kind/minikube demos for the Audit service.
# In AWS the audit service points at the real DynamoDB table provisioned by Terraform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: fcg-infra
  labels:
    app: dynamodb-local
    part-of: fiap-cloud-games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  template:
    metadata:
      labels:
        app: dynamodb-local
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:2.5.0
          args:
            - "-jar"
            - "DynamoDBLocal.jar"
            - "-sharedDb"
            - "-inMemory"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local-service
  namespace: fcg-infra
  labels:
    app: dynamodb-local
spec:
  type: ClusterIP
  selector:
    app: dynamodb-local
  ports:
    - port: 8000
      targetPort: http
