apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fcg-infra
  labels:
    app: grafana
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-service:3100
        isDefault: true
        editable: true