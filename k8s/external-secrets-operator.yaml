# References to External Secrets Operator. Apply ONLY after installing ESO:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# These manifests pull the bundled FCG secret from AWS Secrets Manager and project it
# as the Kubernetes Secret names consumed by each service via envFrom.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # For production EKS, prefer IRSA on the ESO service account.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: users-secret
  namespace: fcg-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: users-secret
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: ConnectionStrings__DefaultConnection }
    - secretKey: RabbitMq__UserName
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: RabbitMq__UserName }
    - secretKey: RabbitMq__Password
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: RabbitMq__Password }
    - secretKey: Jwt__Secret
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: Jwt__Secret }
    - secretKey: AdminUser__Name
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__Name }
    - secretKey: AdminUser__Email
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__Email }
    - secretKey: AdminUser__Password
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__Password }
    - secretKey: AdminUser__Role
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__Role }
    - secretKey: AdminUser__Status
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__Status }
    - secretKey: AdminUser__EmailConfirmed
      remoteRef: { key: cloud-games-dev-fcg-secrets, property: AdminUser__EmailConfirmed }
---
